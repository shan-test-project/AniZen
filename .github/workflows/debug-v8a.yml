name: AniZen v8a R8 Debug

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-v8a:
    name: Build arm64-v8a R8 debug-signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VN=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$CURRENT_VN"
          echo "VERSION=$CURRENT_VN" >> "$GITHUB_ENV"
          echo "Building AniZen v$CURRENT_VN"

      - name: Build arm64-v8a maximum R8 debug-signed APK
        run: ./gradlew assembleR8Debug -PabiList=arm64-v8a -Pandroid.enableR8.fullMode=true -Pinclude-telemetry=false -Penable-updater=false --no-daemon

      - name: Rename and validate APK
        run: |
          VERSION="${{ env.VERSION }}"
          mkdir -p dist
          find app/build/outputs/apk/r8Debug -type f -name "*.apk" -exec cp {} "dist/AniZen-v${VERSION}-v8a-r8-debug.apk" \;
          APK="dist/AniZen-v${VERSION}-v8a-r8-debug.apk"
          test -s "$APK"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "APK size: ${SIZE_MB} MiB (${SIZE_BYTES} bytes)"
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "The optimized APK exceeds the expected size ceiling." >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-v${{ env.VERSION }}-v8a-r8-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
