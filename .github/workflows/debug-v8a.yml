name: AniZen v8a R8 Debug

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-v8a:
    name: Build arm64-v8a R8 debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get current version
        run: |
          CURRENT_VN=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$CURRENT_VN" >> "$GITHUB_ENV"

      - name: Build arm64-v8a R8 debug APK
        run: ./gradlew assembleDebug -PabiList=arm64-v8a -Pandroid.enableR8.fullMode=true -Pdisable-code-shrink=false -Pinclude-telemetry=false -Penable-updater=false --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} "dist/AniZen-v${VERSION}-v8a-r8-debug.apk" \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-v${VERSION}-v8a-r8-debug
          path: dist/AniZen-v${VERSION}-v8a-r8-debug.apk
          if-no-files-found: error
          retention-days: 7
